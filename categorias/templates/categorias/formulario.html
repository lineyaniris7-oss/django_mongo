{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de categoría</title>
    <link rel="stylesheet" href="{% static 'categorias/estilos.css' %}">
</head>
<body>

    <header class="encabezado">
        <div class="encabezado-interno">
            <span class="marca">Inventario</span>
            <nav class="menu">
                <a href="{% url 'productos:listar' %}">Productos</a>
                <a href="{% url 'categorias:listar' %}" class="activo">Categorías</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">

        <h1>Formulario de categoría</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="mensaje {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form class="formulario" method="POST">
            {% csrf_token %}

            <div class="campo">
                <label for="nombre">Nombre de la categoría</label>
                <input
                    id="nombre"
                    type="text"
                    name="nombre"
                    maxlength="50"
                    value="{{ categoria.nombre|default:'' }}"
                    required
                >
            </div>

            <div class="campo">
                <label for="descripcion">Descripción</label>
                <textarea
                    id="descripcion"
                    name="descripcion"
                    maxlength="200"
                    rows="4"
                >{{ categoria.descripcion|default:'' }}</textarea>
            </div>

            <button class="boton" type="submit">Guardar categoría</button>
        </form>

        <a class="volver" href="{% url 'categorias:listar' %}">
            Volver a categorías
        </a>

    </main>

</body>
</html>
